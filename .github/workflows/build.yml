name: Maksut

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Prepare clojure env
        uses: ./.github/actions/prepare-clojure-env

      - name: Set up UI env
        uses: ./.github/actions/setup-ui-env

      - name: Lint maksut-ui
        run: |
          cd src/maksut-ui
          pnpm run lint

      - name: Run tests and build uberjar
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          GA_BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com/Opetushallitus/ci-tools.git
          source ci-tools/common/setup-tools.sh
          pnpm install
          cd src/maksut-ui && pnpm exec playwright install --with-deps chromium && cd -
          ./bin/cibuild.sh run-all-tests-and-create-uberjar

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: restore-build
        with:
          path: target
          key: ${{ github.sha }}

  deploy-container:
    needs: [ test-and-build ]
    uses: Opetushallitus/.github/.github/workflows/push-scan-java-ecr.yml@2f06269d5ac067ef17a76d2d5742db0b325e9a2e # main
    with:
      application: maksut
      base-image: baseimage-fatjar-openjdk21:master
      configfolder: oph-configuration
      jarfile: maksut
    secrets:
      AWS_UTILITY_ROLE_ARN: ${{ secrets.AWS_OPH_UTILITY_ROLE_ARN }}
