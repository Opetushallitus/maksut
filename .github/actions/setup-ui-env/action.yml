name: setup-ui-env
description: 'Setup UI environment'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 11.24.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        cache-dependency-path: src/maksut-ui/pnpm-lock.yaml
        registry-url: 'https://npm.pkg.github.com'
        scope: '@opetushallitus'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: node_modules-cache
      with:
        path: ${{ github.workspace }}/src/maksut-ui/node_modules
        key: ${{ runner.os }}-modules-hoisted-${{ hashFiles('./src/maksut-ui/pnpm-lock.yaml') }}
    - name: Install npm dependencies
      if: steps.node_modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd src/maksut-ui
        pnpm install
