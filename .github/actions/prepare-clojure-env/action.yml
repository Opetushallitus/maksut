name: 'Prepare clojure env'
description: 'Prepare clojure enviroment for build'
runs:
  using: "composite"
  steps:
    - name: Cache local Maven repository
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 21
      uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set timezone to Europe/Helsinki
      shell: bash
      run: |
        sudo timedatectl set-timezone Europe/Helsinki
        echo "Europe/Helsinki" | sudo tee /etc/timezone

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@bc7570e912b028bbcc22f457adec7fdf98e2f4ed # 12.5
      with:
        lein: 2.9.1